name: camouflage

on:
  pull_request:
  push:
    branches: [main]

jobs:
  camouflage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Station path check
        run: |
          npm run dev -- --no-clipboard &
          SERVER_PID=$!
          sleep 5
          npm run check
          STATUS=$?
          kill $SERVER_PID || true
          exit $STATUS

      - name: Forbidden-token scan
        run: |
          if rg -n -i 'bastion|escape-hatch|rendezvous|88421007|LIMITEDHYPE|lorca|limited-hype-station-escape-hatch' \
              public/ CHARTER.md CONSTRAINTS.md README.md SCORE-ALIGN.md ALIGN-WORKFLOW.md CARETAKER.md FIELD-CONTRACT.md \
            | grep -v -F 'No hidden Lorca, trading, or procurement page on this brand surface.' \
            | grep .; then
            echo "forbidden token found"
            exit 1
          fi
          echo "forbidden-token scan clean"
